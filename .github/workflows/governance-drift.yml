name: Governance and Asset Records

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: python -m pip install PyYAML==6.0.3 Pillow==12.3.0 numpy==2.3.5 jsonschema==4.26.0
      - name: Verify governance baseline
        run: |
          python ai-governance-framework/governance_tools/governance_drift_checker.py \
            --repo . \
            --framework-root ./ai-governance-framework \
            --format human
      - name: Run existing input identity regressions
        run: python concepts/kck-03b1/tools/test_preflight_hash.py
      - name: Verify output measurement and deterministic repair invariants
        run: |
          python concepts/kck-03b1/tools/test_measure_output.py
          python concepts/kck-03b1/tools/test_correct_a3_highlights.py
          python concepts/kck-03b1/tools/test_correct_robot_highlights.py
          python concepts/kck-03b1/tools/test_concept_provenance.py
          python concepts/kck-03b2/tools/test_correct_dinosaur_side_belly.py
      - name: Validate asset records against existing schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for schema_path, records in (
              (Path('manifests/character-manifest.schema.json'), [Path('manifests/characters.json')]),
              (Path('provenance/schema/provenance.schema.json'), sorted(Path('provenance').glob('*/*.json')) + sorted(Path('concepts').glob('**/*.provenance.json'))),
          ):
              schema = json.loads(schema_path.read_text())
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema)
              for record in records:
                  if record == schema_path:
                      continue
                  validator.validate(json.loads(record.read_text()))
                  print('VALID', record)
          PY
      - name: Verify character preparation and QA invariants
        run: python .agents/skills/kck-character-pipeline/scripts/test_pipeline.py
